
# Runs the office and all three desk games as separate containers, mirroring
# `npm run start:all`. Bring everything up with:
#
#   docker compose up --build -d
#
# Then open http://<server-host>:3100. Browsers only hand out a mic on a secure
# origin (localhost counts, a public IP/domain does not) — see README.md's
# "Deploy with Docker" section for the two ways to get https here. Every service
# switches to https by itself the instant certs/ has key.pem + cert.pem (mounted
# below); PORT is pinned on the office so it doesn't jump to its non-Docker
# default of 3443 the moment that happens.
services:
  atrium:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3100:3100"
    environment:
      - PORT=3100
    volumes:
      - ./certs:/app/certs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3100/ || wget -q -O - --no-check-certificate https://127.0.0.1:3100/"]
      interval: 30s
      timeout: 5s
      retries: 3

  gaple:
    build:
      context: .
      dockerfile: games/gaple/Dockerfile
    ports:
      - "3200:3200"
    volumes:
      - ./certs:/app/certs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3200/ || wget -q -O - --no-check-certificate https://127.0.0.1:3200/"]
      interval: 30s
      timeout: 5s
      retries: 3

  tumble:
    build:
      context: .
      dockerfile: games/tumble/Dockerfile
    ports:
      - "3300:3300"
    volumes:
      - ./certs:/app/certs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3300/ || wget -q -O - --no-check-certificate https://127.0.0.1:3300/"]
      interval: 30s
      timeout: 5s
      retries: 3

  werewolf:
    build:
      context: .
      dockerfile: games/werewolf/Dockerfile
    ports:
      - "3400:3400"
    volumes:
      - ./certs:/app/certs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3400/ || wget -q -O - --no-check-certificate https://127.0.0.1:3400/"]
      interval: 30s
      timeout: 5s
      retries: 3
