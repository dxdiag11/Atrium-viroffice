<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Werewolf – Virtual Office Games</title>
<meta name="description" content="Werewolf social deduction 6–12 pemain. Dibuka dari menu game Virtual Office; diskusi lewat voice chat kantor.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ PRE-JOIN ============ -->
<section id="prejoin" class="screen">
  <div class="card">
    <h1>🐺 WEREWOLF</h1>
    <p>Social deduction untuk <b>6–12 pemain</b>. Diskusi siang hari lewat <b>voice chat kantor</b> yang sudah jalan di belakang layar.</p>
    <label class="fld"><span>Nama kamu</span>
      <input id="nameInput" maxlength="16" placeholder="Nama" autocomplete="off">
    </label>
    <button id="joinBtn" class="btn primary">Masuk room</button>
    <p id="prejoinMsg" class="muted"></p>
  </div>
</section>

<!-- ============ LOBBY ============ -->
<section id="lobby" class="screen hidden">
  <div class="card">
    <h1>🐺 WEREWOLF</h1>
    <div class="ph">Ruang Tunggu <span id="lobbyCount" class="muted"></span></div>
    <ul id="lobbyList" class="plist"></ul>
    <p class="muted small">Butuh 6–12 pemain. Host yang menekan mulai. Peran dibagi acak: Werewolf, Peramal, Dokter, Warga.</p>
    <div id="lobbyMsg" class="muted"></div>
    <button id="startBtn" class="btn primary hidden">Mulai permainan</button>
    <button id="lobbyBack" class="btn ghost">← Kembali ke Virtual Office</button>
  </div>
</section>

<!-- ============ GAME ============ -->
<section id="game" class="screen wide hidden">
  <header id="bar">
    <span class="brand">🐺 WEREWOLF</span>
    <span id="phaseBadge" class="badge">Malam 1</span>
    <span id="timer" class="timer"></span>
    <span class="spacer"></span>
    <button id="gameBack" class="btn ghost small">← Kembali ke Virtual Office</button>
  </header>

  <div id="board">
    <div class="col-left">
      <div id="roleCard" class="rolecard" hidden></div>
      <div id="action" class="action"></div>
    </div>
    <div class="col-mid">
      <ul id="players" class="grid"></ul>
    </div>
    <aside class="col-log">
      <div class="log-h">Riwayat</div>
      <div id="log" class="log"></div>
    </aside>
  </div>
</section>

<div id="over" class="overlay hidden"></div>
<div id="toast" class="toast" hidden></div>

<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>
</body>
</html>
